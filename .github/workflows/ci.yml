name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13', cache: pip, cache-dependency-path: backend/requirements.lock}
      - run: pip install -r backend/requirements.lock
      - run: python -m pytest
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-fund
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  compose:
    runs-on: ubuntu-latest
    env:
      AUTO_FETCH_RSS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up --build -d --wait
      - run: curl --fail http://localhost:8080/api/health
      - run: docker compose exec -T api alembic check
      - run: npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          retention-days: 7
      - if: always()
        run: docker compose logs --no-color && docker compose down
